<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ripple — Next-Gen Zero-Trace Encrypted Messenger">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ripple">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ripple — Encrypted Messenger</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #060D1A;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    #ripple-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #060D1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .emblem-wrapper {
      position: relative;
      width: 88px;
      height: 88px;
      margin-bottom: 24px;
    }

    .emblem-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.35) 0%, rgba(14, 165, 233, 0) 70%);
      border-radius: 50%;
      animation: pulseGlow 2.4s ease-in-out infinite;
    }

    .emblem-icon {
      position: relative;
      width: 88px;
      height: 88px;
      background: linear-gradient(135deg, #0284C7 0%, #0369A1 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 32px rgba(2, 132, 199, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .emblem-icon svg {
      width: 44px;
      height: 44px;
      fill: #FFFFFF;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 4px;
      color: #FFFFFF;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .brand-subtitle {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #38BDF8;
      text-transform: uppercase;
      margin-bottom: 32px;
      opacity: 0.9;
    }

    .progress-track {
      width: 180px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #38BDF8, #0EA5E9, transparent);
      animation: scanBar 1.6s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    }

    @keyframes scanBar {
      0% { left: -100%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div id="ripple-preloader">
    <div class="emblem-wrapper">
      <div class="emblem-glow"></div>
      <div class="emblem-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
        </svg>
      </div>
    </div>
    <div class="brand-title">RIPPLE</div>
    <div class="brand-subtitle">ENCRYPTED WORKSTATION</div>
    <div class="progress-track">
      <div class="progress-bar"></div>
    </div>
  </div>

  <script>
    // Fade out preloader smoothly when Flutter first frame renders
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('ripple-preloader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
